events {
    worker_connections 1024;
}

http {
    # 1. Use Docker's internal DNS resolver (valid for 10 seconds)
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # Frontend (Vite)
        location / {
            # 2. Use a variable to force re-resolution
            set $frontend_host frontend;
            proxy_pass http://$frontend_host:5173;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Backend API
        location /api/ {
            # 3. Use a variable for backend too
            set $backend_host backend;
            
            # Note: When using variables, proxy_pass cannot have a URI part (like /api/).
            # Nginx will automatically pass the full request URI (e.g. /api/scan/start)
            proxy_pass http://$backend_host:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Increase timeout for long scans
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
